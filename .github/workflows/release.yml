name: Release Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the artifacts (e.g. v1.0.1)"
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write

jobs:
  release:
    name: Build and attach release artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so build_release.sh can describe tags

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install audio smoke dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Smoke test before packaging
        run: bash tools/smoke.sh --strict

      - name: Resolve version
        id: ver
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          [[ ${#VERSION} -le 100 && "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]] || { echo 'Invalid version label'; exit 2; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build artifacts
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: bash tools/build_release.sh "$RELEASE_VERSION"

      - name: Verify unpacked release before upload
        run: |
          python3 tools/check-release-artifact.py dist/*.tar.gz
          python3 tools/check-release-artifact.py dist/*.zip --structure-only

      - name: Upload workflow artifact (always)
        uses: actions/upload-artifact@v7
        with:
          name: alchemical-synthesizer-${{ steps.ver.outputs.version }}
          path: dist/

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/*.spdx
            dist/PROVENANCE.json
          fail_on_unmatched_files: true
