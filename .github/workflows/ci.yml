name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test (shipped-test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install product dependencies
        working-directory: product
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run security regression tests
        run: node --test product/src/api/account-security.test.js product/src/api/acp.test.js product/src/auth/rate-limit.test.js product/public/dashboard/session.test.js deploy/aether/serve.test.js docs/absorb-alchemize/engine-path.test.cjs

      - name: Run smoke test
        run: bash tools/smoke.sh --strict

      - name: Build distribution artifacts (dry run)
        run: bash tools/build_release.sh

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
